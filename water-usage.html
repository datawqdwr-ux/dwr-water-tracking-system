  /* 🔒 Export Guard: ສະເພາະ Super Admin ແລະ Staff ເທົ່ານັ້ນທີ່ດາວໂຫຼດ/ສົ່ງຂໍ້ມູນອອກໄດ້ */
  (function () {
    var USER_KEYS = ["lao_wastewater_current_user_v2", "lao_water_current_user_v2"];
    function okRole(r) {
      r = String(r || "").toLowerCase();
      return r === "admin" || r === "sub_admin" || r === "officer" || r === "super_admin" || r === "staff";
    }
    function canExport() {
      try {
        if (typeof currentUserRole !== "undefined") return okRole(currentUserRole);
      } catch (e) {}
      try {
        for (var i = 0; i < USER_KEYS.length; i++) {
          var raw = localStorage.getItem(USER_KEYS[i]);
          if (raw) { var u = JSON.parse(raw); if (u && u.id !== "guest" && okRole(u.role)) return true; }
        }
        var s = JSON.parse(sessionStorage.getItem("waterSession") || "null");
        if (s && s.id !== "guest" && okRole(s.role)) return true;
      } catch (e) {}
      return false;
    }
    var lastWarn = 0;
    function deny() {
      var now = Date.now(); if (now - lastWarn < 1500) return; lastWarn = now;
      var msg = "ການດາວໂຫຼດ/ສົ່ງຂໍ້ມູນອອກ ອະນຸຍາດສະເພາະ Super Admin ແລະ Staff ເທົ່ານັ້ນ.";
      if (window.Swal) Swal.fire({ icon: "warning", title: "🔒 ບໍ່ມີສິດດາວໂຫຼດຂໍ້ມູນ", text: msg, confirmButtonText: "ຕົກລົງ", confirmButtonColor: "#0284c7" });
      else alert("🔒 " + msg);
    }
    window.__dwrCanExport = canExport;
    var aClick = HTMLAnchorElement.prototype.click;
    HTMLAnchorElement.prototype.click = function () {
      if (this.hasAttribute("download") && !canExport()) { deny(); return; }
      return aClick.apply(this, arguments);
    };
    var aDispatch = HTMLAnchorElement.prototype.dispatchEvent;
    HTMLAnchorElement.prototype.dispatchEvent = function (ev) {
      if (this.hasAttribute("download") && ev && ev.type === "click" && !canExport()) { deny(); return false; }
      return aDispatch.apply(this, arguments);
    };
    var origPrint = window.print;
    window.print = function () {
      if (!canExport()) { deny(); return; }
      return origPrint.apply(window, arguments);
    };
    document.addEventListener("DOMContentLoaded", function () {
      try {
        if (window.XLSX && XLSX.writeFile) {
          var wf = XLSX.writeFile;
          XLSX.writeFile = function () { if (!canExport()) { deny(); return; } return wf.apply(XLSX, arguments); };
        }
        if (window.jspdf && jspdf.jsPDF && jspdf.jsPDF.prototype.save) {
          var sv = jspdf.jsPDF.prototype.save;
          jspdf.jsPDF.prototype.save = function () { if (!canExport()) { deny(); return this; } return sv.apply(this, arguments); };
        }
      } catch (e) {}
    });
  })();
  </script>

function getCustomProjectCategories() {
  try {
    const saved = localStorage.getItem("custom_project_categories");
    if (saved) {
      const arr = JSON.parse(saved);
      if (Array.isArray(arr)) {
        return arr.filter(c => typeof c === "string" && c.trim() && !PROJECT_CATEGORIES.includes(c.trim()));
      }
    }
  } catch (e) {}
  return [];
}
function saveCustomProjectCategory(newCat) {
  if (!newCat || typeof newCat !== "string") return false;
  const trimmed = newCat.trim();
  if (!trimmed || PROJECT_CATEGORIES.includes(trimmed)) return false;
  try {
    const list = getCustomProjectCategories();
    if (!list.includes(trimmed)) {
      list.push(trimmed);
      localStorage.setItem("custom_project_categories", JSON.stringify(list));
      return true;
    }
  } catch (e) {}
  return false;
}
function deleteCustomProjectCategory(cat) {
  if (!cat || typeof cat !== "string") return false;
  try {
    const list = getCustomProjectCategories().filter(c => c !== cat.trim());
    localStorage.setItem("custom_project_categories", JSON.stringify(list));
    return true;
  } catch (e) {}
  return false;
}
function getAllProjectCategories(extraFromProjects = []) {
  const custom = getCustomProjectCategories();
  const set = new Set([...PROJECT_CATEGORIES]);
  custom.forEach(c => set.add(c));
  if (Array.isArray(extraFromProjects)) {
    extraFromProjects.forEach(p => {
      const c = p && (typeof p === "string" ? p : p.projectCategory);
      if (c && typeof c === "string" && c.trim()) set.add(c.trim());
    });
  }
  return Array.from(set);
}

// Firebase ບໍ່ຮັບ undefined / NaN
function clean(v) {
  if (v === undefined) return null;
  if (typeof v === "number" && !isFinite(v)) return null;
  if (Array.isArray(v)) return v.map(clean);
  if (v && typeof v === "object") {
    const o = {};
    Object.keys(v).forEach((k) => { if (v[k] !== undefined) o[k] = clean(v[k]); });
    return o;
  }
  return v;
}
var safeKey = (id) => String(id || `id-${Date.now()}`).replace(/[.#$\[\]\/]/g, "_");
var toList = (val) => val ? Object.keys(val).map((k) => ({ id: val[k] && val[k].id || k, ...val[k] })) : [];
var readCache = (key) => { try { const r = localStorage.getItem(key); const p = r ? JSON.parse(r) : null; return Array.isArray(p) ? p : null; } catch (e) { return null; } };
var writeCache = (key, list) => { try { localStorage.setItem(key, JSON.stringify(list)); } catch (e) {} };

async function seedInitialDataIfNeeded() { /* ບໍ່ໃສ່ຂໍ້ມູນຕົວຢ່າງລົງຖານຂໍ້ມູນຈິງ */ }

// ຂໍ້ມູນໂຄງການທີ່ເຄີຍເກັບໄວ້ໃນເຄື່ອງນີ້ (ຈາກລະບົບເກົ່າ) → ຖາມກ່ອນອັບໂຫລດເຂົ້າຖານຂໍ້ມູນໃໝ່ (ເທື່ອດຽວ)
async function offerLocalMigration() {
  if (localStorage.getItem(MIGRATE_FLAG)) return false;
  localStorage.setItem(MIGRATE_FLAG, "asked");
  const cached = readCache(LOCAL_STORAGE_KEY) || [];
  const demoIds = new Set(INITIAL_PROJECTS.map((p) => p.id));
  const real = cached.filter((p) => p && p.id && !(demoIds.has(p.id) && !p.createdBy));
  if (!real.length) return false;
  const ok = window.confirm(`ພົບຂໍ້ມູນໂຄງການ ${real.length} ລາຍການ ທີ່ເກັບໄວ້ໃນເຄື່ອງນີ້ ຈາກລະບົບເກົ່າ.\n\nຕ້ອງການອັບໂຫລດເຂົ້າຖານຂໍ້ມູນໃໝ່ (Firebase ດຽວກັບລະບົບຄຸນນະພາບນ້ຳ) ບໍ່?`);
  if (!ok) return false;
  const updates = {};
  real.forEach((p) => { updates[`${PATHS.projects}/${safeKey(p.id)}`] = clean({ ...p, migratedAt: new Date().toISOString() }); });
  await update(dbRef(rtdb), updates);
  localStorage.setItem(MIGRATE_FLAG, "done");
  return true;
}

function ensureProjectWaterFee(p) {
  if (!p) return p;
  if (p.waterFeePayment && p.waterFeePayment.status) return p;
  const rate = 150;
  const vol = p.waterVolume ? p.waterVolume * 365 : 100000;
  const due = Math.round(rate * vol);
  const isExp = p.status === "expired";
  const isPart = p.id === "proj-002";
  const st = isExp ? "pending" : (isPart ? "partial" : "paid");
  const paid = isExp ? 0 : (isPart ? Math.round(due * 0.6) : due);
  const rem = isExp ? due : (isPart ? Math.round(due * 0.4) : 0);
  return {
    ...p,
    waterFeePayment: {
      status: st,
      ratePerUnit: String(rate),
      billedVolume: String(vol),
      totalAmountDue: String(due),
      amountPaid: String(paid),
      remainingBalance: String(rem),
      paymentCycle: "annual",
      billedYear: "2026",
      receiptNumber: `REC-2026/${p.id ? p.id.replace("proj-", "") : "001"}`,
      paymentDate: isExp ? "" : "2026-01-15",
      receivingAgency: "ຄັງເງິນແຫ່ງຊາດ",
      bankAccount: "BCEL One",
      paymentSlip: isExp ? "" : `SLIP-WTR-${p.id ? p.id.replace("proj-", "") : "001"}`,
      notes: isExp ? "ແຈ້ງເຕືອນຄ້າງຊຳລະຄ່ານໍາໃຊ້ນໍ້າ" : "ຊຳລະຄ່ານໍາໃຊ້ນໍ້າຮຽບຮ້ອຍແລ້ວ"
    }
  };
}

function subscribeToWaterProjects(onUpdate, onError) {
  const cached = readCache(LOCAL_STORAGE_KEY) || INITIAL_PROJECTS;
  if (cached && cached.length) onUpdate(cached.map(ensureProjectWaterFee));
  try {
    return onValue(dbRef(rtdb, PATHS.projects), async (snap) => {
      let list = toList(snap.val()).sort((a, b) => String(b.updatedAt || "").localeCompare(String(a.updatedAt || "")));
      if (!list.length) {
        const migrated = await offerLocalMigration().catch((e) => { console.warn(e); return false; });
        if (migrated) return; // ລໍຖ້າຂໍ້ມູນທີ່ອັບໂຫລດ ກັບມາທາງ listener
        list = INITIAL_PROJECTS;
      }
      const safeList = list.map(ensureProjectWaterFee);
      writeCache(LOCAL_STORAGE_KEY, safeList);
      onUpdate(safeList);
    }, (error) => {
      console.warn("Realtime Database projects listener error:", error);
      if (onError) onError(error);
    });
  } catch (err) {
    if (onError) onError(err);
    return () => {};
  }
}
async function saveProject(project) {
  const updated = ensureProjectWaterFee({ ...project, updatedAt: new Date().toISOString(), createdBy: project.createdBy || FIREBASE_ACCOUNT_EMAIL });
  const list = (readCache(LOCAL_STORAGE_KEY) || []).map(ensureProjectWaterFee);
  const i = list.findIndex((p) => p.id === project.id);
  if (i >= 0) list[i] = updated; else list.unshift(updated);
  writeCache(LOCAL_STORAGE_KEY, list);
  await set(dbRef(rtdb, `${PATHS.projects}/${safeKey(project.id)}`), clean(updated));
}
async function deleteProject(id) {
  writeCache(LOCAL_STORAGE_KEY, (readCache(LOCAL_STORAGE_KEY) || []).filter((p) => p.id !== id));
  await remove(dbRef(rtdb, `${PATHS.projects}/${safeKey(id)}`));
}

function subscribeToDirectMessages(onUpdate) {
  const cached = readCache(LOCAL_MESSAGES_KEY);
  if (cached) onUpdate(cached);
  try {
    return onValue(dbRef(rtdb, PATHS.messages), (snap) => {
      const list = toList(snap.val()).sort((a, b) => String(b.sentAt || "").localeCompare(String(a.sentAt || "")));
      writeCache(LOCAL_MESSAGES_KEY, list);
      onUpdate(list);
    }, (err) => console.warn("messages listener error:", err));
  } catch (e) { return () => {}; }
}
async function sendDirectMessage(msg) {
  const newMsg = { ...msg, id: `msg-${Date.now()}-${Math.random().toString(36).substring(2, 7)}`, sentAt: new Date().toISOString() };
  const list = readCache(LOCAL_MESSAGES_KEY) || [];
  list.unshift(newMsg);
  writeCache(LOCAL_MESSAGES_KEY, list);
  try { await set(dbRef(rtdb, `${PATHS.messages}/${newMsg.id}`), clean(newMsg)); } catch (e) { console.warn("message save error:", e); }
  return newMsg;
}

async function addAuditLog(action, entityName, details, userName = "datawqdwr@gmail.com") {
  const log = { id: `log-${Date.now()}-${Math.random().toString(36).substring(2, 6)}`, action, entityName, details, userName, timestamp: new Date().toISOString() };
  const list = readCache(LOCAL_LOGS_KEY) || [];
  list.unshift(log);
  if (list.length > 200) list.pop();
  writeCache(LOCAL_LOGS_KEY, list);
  try { await set(dbRef(rtdb, `${PATHS.logs}/${log.id}`), clean(log)); } catch (e) { console.warn("audit log save error:", e); }

async function deleteAuditLog(logId) {

    await remove(dbRef(rtdb, `${PATHS.logs}/${logId}`));

    console.warn("audit log delete error:", e);
  }
  const list = (readCache(LOCAL_LOGS_KEY) || []).filter((l) => l.id !== logId);
  writeCache(LOCAL_LOGS_KEY, list);
  return list;

async function clearAllAuditLogs() {
  try {
    await remove(dbRef(rtdb, PATHS.logs));

    console.warn("audit logs clear error:", e);
  }
  writeCache(LOCAL_LOGS_KEY, []);
  return [];

function subscribeToAuditLogs(onUpdate, onError) {
  const cached = readCache(LOCAL_LOGS_KEY);
  if (cached) onUpdate(cached);
  try {
    return onValue(dbQuery(dbRef(rtdb, PATHS.logs), limitToLast(150)), (snap) => {
      const list = toList(snap.val()).sort((a, b) => String(b.timestamp || "").localeCompare(String(a.timestamp || "")));
      writeCache(LOCAL_LOGS_KEY, list);
      onUpdate(list);
    }, (err) => { console.warn("auditLogs listener error:", err); if (onError) onError(err); });
  } catch (err) { if (onError) onError(err); return () => {}; }

/* --- ບັນຊີຜູ້ໃຊ້ຮ່ວມກັນ: ເກັບຢູ່ system_config/users (ບ່ອນດຽວກັບ ລະບົບຄຸນນະພາບນ້ຳ) ---
   ລະບົບຄຸນນະພາບນ້ຳ ໃຊ້ name/password/role (SUPER_ADMIN, STAFF)
   ລະບົບນີ້ໃຊ້ username/role (admin, officer, viewer) → ແປງໄປມາອັດຕະໂນມັດ */
var Q2U = { SUPER_ADMIN: "admin", ADMIN: "sub_admin", STAFF: "officer", VIEWER: "viewer" };
var U2Q = { admin: "SUPER_ADMIN", sub_admin: "ADMIN", officer: "STAFF", viewer: "VIEWER" };
var GUEST_USER = {
  id: "guest", username: "guest", password: "", fullName: "ຜູ້ເບິ່ງທົ່ວໄປ (ຍັງບໍ່ເຂົ້າສູ່ລະບົບ)", position: "", email: "", phone: "",
  organization: "", department: "", role: "viewer", avatarColor: "bg-slate-500", notes: "", createdAt: "", updatedAt: ""
};
var DEFAULT_ADMIN = {
  id: "default-admin", username: "admin", password: "9999", fullName: "Super Admin (ບັນຊີເລີ່ມຕົ້ນ)", role: "admin",
  notes: "ບັນຊີເລີ່ມຕົ້ນ Super Admin", avatarColor: "bg-blue-600"
};
var DEFAULT_SUB_ADMIN = {
  id: "default-subadmin", username: "subadmin", password: "8888", fullName: "Admin (ບັນຊີເລີ່ມຕົ້ນ)", role: "sub_admin",
  notes: "ບັນຊີເລີ່ມຕົ້ນ Admin (ບໍ່ມີສິດລົບປະຫວັດ/ລ້າງຂໍ້ມູນ/ຈັດການຜູ້ໃຊ້/ຕັ້ງລະຫັດດາວໂຫຼດ)", avatarColor: "bg-indigo-600"
};
function normalizeUser(raw, fallbackId) {
  const rawCode = raw.userCode ? String(raw.userCode).toLowerCase().replace(/[^a-z0-9_-]/g, "") : "";
  const username = raw.username || raw.name || rawCode || `user_${raw.id || fallbackId || "1"}`;
  return {
    id: raw.id || fallbackId || `usr-${Date.now()}`,
    username: String(username).toLowerCase().trim(),
    password: String(raw.password || raw.pin || ""),
    fullName: raw.fullName || raw.name || "ຜູ້ໃຊ້ລະບົບ",
    position: raw.position || "",
    email: raw.email || "",
    phone: raw.phone || "",
    organization: raw.organization || "ກະຊວງກະສິກໍາ ແລະ ສິ່ງແວດລ້ອມ",
    department: raw.department || "ກົມຊັບພະຍາກອນນໍ້າ",
    role: Q2U[raw.role] || raw.role || "viewer",
    avatarColor: raw.avatarColor || "bg-blue-600",
    notes: raw.notes || "",
    createdAt: raw.createdAt || new Date().toISOString(),
    updatedAt: raw.updatedAt || new Date().toISOString()
  };
}
function toStoredUser(user) {
  const { id, ...rest } = user;
  return clean({ ...rest, id, name: user.username, role: U2Q[user.role] || "VIEWER" });
}
function withDefaultAdmin(list) {
  let out = list;
  if (!out.some((u) => u.role === "admin")) out = [...out, normalizeUser(DEFAULT_ADMIN, "default-admin")];
  if (!out.some((u) => u.role === "sub_admin")) out = [...out, normalizeUser(DEFAULT_SUB_ADMIN, "default-subadmin")];
  if (!list.some((u) => u.role === "officer")) out = [...out, normalizeUser({ id: "default-staff", username: "staff", password: "1234", fullName: "Staff (ບັນຊີເລີ່ມຕົ້ນ)", role: "officer", notes: "ບັນຊີເລີ່ມຕົ້ນ" }, "default-staff")];
  return out;
}
function subscribeToUserProfiles(onUpdate, onError) {
  const cached = readCache(LOCAL_USERS_KEY);
  if (cached && cached.length) onUpdate(withDefaultAdmin(cached.map((u) => normalizeUser(u))));
  try {
    return onValue(dbRef(rtdb, PATHS.users), (snap) => {
      const val = snap.val() || {};
      const list = Object.keys(val).map((k) => normalizeUser({ ...val[k], id: k }, k));
      writeCache(LOCAL_USERS_KEY, list);
      onUpdate(withDefaultAdmin(list));
    }, (error) => { console.warn("users listener error:", error); if (onError) onError(error); });
  } catch (err) { if (onError) onError(err); return () => {}; }
}
async function seedInitialUsersIfNeeded() { /* ບໍ່ສ້າງບັນຊີຕົວຢ່າງ (password123) ໃນຖານຂໍ້ມູນຈິງ */ }
async function saveUserProfile(user) {
  if (!user || user.id === "guest") return;
  const updatedUser = { ...user, updatedAt: new Date().toISOString() };
  await set(dbRef(rtdb, `${PATHS.users}/${safeKey(user.id)}`), toStoredUser(updatedUser));
}
async function deleteUserProfile(userId) {
  if (!userId || userId === "default-admin" || userId === "default-subadmin" || userId === "default-staff" || userId === "guest") return;
  await remove(dbRef(rtdb, `${PATHS.users}/${safeKey(userId)}`));
}

var DEFAULT_EXPORT_PASSCODE = "8888";

function getExportPasscode() {
  return localStorage.getItem("water_export_passcode") || DEFAULT_EXPORT_PASSCODE;
}

function setExportPasscode(val, updatedBy = "Super Admin") {
  const code = String(val || "").trim();
  localStorage.setItem("water_export_passcode", code);
  try {
    set(dbRef(rtdb, PATHS.exportSecurity), {
      passcode: code,
      updatedAt: new Date().toISOString(),
      updatedBy: updatedBy || "Super Admin"
    });
  } catch (e) {
    console.warn("exportSecurity save error:", e);
  }
}

function isElevatedExportUser() {
  let u = null;
  try {
    u = JSON.parse(localStorage.getItem("lao_water_current_user_v2") || sessionStorage.getItem("waterSession") || "null");
  } catch (e) {}
  if (!u || u.id === "guest") return false;
  const role = String(u.role || "").toLowerCase();
  return role === "admin" || role === "sub_admin" || role === "officer" || role === "super_admin" || role === "staff";
}

}
async function restoreSystemBackup(jsonString, mode = "replace") {
  const parsed = JSON.parse(jsonString);
  const importedProjects = parsed.data?.projects || parsed.projects || (Array.isArray(parsed) ? parsed : []);
  const importedUsers = parsed.data?.users || parsed.users || [];
  if (!Array.isArray(importedProjects) || importedProjects.length === 0) {
    throw new Error("ໄຟລ໌ Backup ບໍ່ຖືກຕ້ອງ ຫຼື ບໍ່ມີຂໍ້ມູນໂຄງການ (Invalid backup format)");
  }
  const updates = {};
  importedProjects.forEach((p) => { if (p && p.id) updates[`${PATHS.projects}/${safeKey(p.id)}`] = clean({ ...p, updatedAt: new Date().toISOString() }); });
  // ບັນຊີຜູ້ໃຊ້ຈາກ Backup: ຂ້າມບັນຊີຕົວຢ່າງທີ່ໃຊ້ລະຫັດ password123 (ບໍ່ປອດໄພ)
  let skippedUsers = 0;
  if (Array.isArray(importedUsers)) {
    importedUsers.forEach((u) => {
      const nu = normalizeUser(u);
      if (!nu.password || nu.password === "password123") { skippedUsers++; return; }
      updates[`${PATHS.users}/${safeKey(nu.id)}`] = toStoredUser(nu);
    });
  }
  await update(dbRef(rtdb), updates);
  writeCache(LOCAL_STORAGE_KEY, importedProjects);
  await addAuditLog("restore", "ລະບົບຂໍ້ມູນ", `ຟື້ນຟູຂໍ້ມູນໂຄງການຈໍານວນ ${importedProjects.length} ລາຍການ${skippedUsers ? ` (ຂ້າມບັນຊີຕົວຢ່າງ ${skippedUsers})` : ""}`, FIREBASE_ACCOUNT_EMAIL);
  return { count: importedProjects.length };
}

        let northing = n1 > 900000 ? n1 : n2;
        return { zone, hemi, easting, northing };

    }
    if (nums.length >= 2) {
      let n1 = parseFloat(nums[0]);
      let n2 = parseFloat(nums[1]);

        let easting, northing;
        if (n1 > 900000 && n2 < 900000) {
          northing = n1;
          easting = n2;

    // ແຖວຊື່ດຽວກັນໃນໄຟລ໌ → ໂຄງການດຽວ
    const byKey = new Map();
    rows.forEach((r) => { const k = projKey(r); byKey.set(k, byKey.has(k) ? mergeProjectData(byKey.get(k), r) : r); });
    const items = [...byKey.values()].map((r) => {
      const ex = projects.find((p) => projKey(p) === projKey(r) || (r.permitNumber && p.permitNumber && _cLao(p.permitNumber) === _cLao(r.permitNumber)));
      return { r, ex };
    });
    showProjectImportPreview(file.name, items, rows.length, cu, onDone);
  };
  pick.click();
}

// ຄິດໄລ່ໄລຍະຫ່າງລະຫວ່າງ 2 ຈຸດພິກັດ (ກິໂລແມັດ)
function calcDistanceKm(lat1, lon1, lat2, lon2) {
  if (lat1 === undefined || lat1 === null || lon1 === undefined || lon1 === null ||
      lat2 === undefined || lat2 === null || lon2 === undefined || lon2 === null) return null;
  const nlat1 = Number(lat1), nlon1 = Number(lon1), nlat2 = Number(lat2), nlon2 = Number(lon2);
  if (!validLL(nlat1, nlon1) || !validLL(nlat2, nlon2)) return null;
  const R = 6371;
  const dLat = (nlat2 - nlat1) * Math.PI / 180;
  const dLon = (nlon2 - nlon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(nlat1 * Math.PI / 180) * Math.cos(nlat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return Number((R * c).toFixed(2));
}

  sessionStorage.setItem("guestMode", "true");

  const hadUser = !!localStorage.getItem(CURRENT_USER_KEY);
  localStorage.removeItem(CURRENT_USER_KEY);
  hideSharedLogin();
  if (hadUser) location.reload();
}
function sharedLogout() {
  localStorage.removeItem(SHARED_SESSION_KEY); sessionStorage.removeItem(SHARED_SESSION_KEY);
  sessionStorage.removeItem("guestMode");
  localStorage.removeItem(CURRENT_USER_KEY);
  showSharedLogin();
}
window.showSharedLogin = showSharedLogin;
window.sharedLogout = sharedLogout;

(async function startSharedAuth() {
  document.getElementById("sl_form")?.addEventListener("submit", sharedLogin);
  document.getElementById("sl_guest")?.addEventListener("click", sharedGuest);
  ["sl_username", "sl_password"].forEach((id) => document.getElementById(id)?.addEventListener("input", clearSharedLoginError));
  document.getElementById("sl_pwToggle")?.addEventListener("click", () => {
    const el = document.getElementById("sl_password");
    el.type = el.type === "password" ? "text" : "password";
    document.getElementById("sl_pwToggle").innerText = el.type === "password" ? "👁️" : "🙈";
  });

  let sess = null;
  try { sess = JSON.parse(localStorage.getItem(SHARED_SESSION_KEY) || sessionStorage.getItem(SHARED_SESSION_KEY) || "null"); } catch (e) {}
  const guest = sessionStorage.getItem("guestMode") === "true";

  if (sess) {
    try {
      const acc = findBySession(await fetchSharedUsers(), sess);
      if (acc) {
        localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(acc.user));
        hideSharedLogin();
        return mountApp();
      }
      localStorage.removeItem(SHARED_SESSION_KEY); sessionStorage.removeItem(SHARED_SESSION_KEY); // ບັນຊີຖືກລົບ ຫຼື ປ່ຽນສິດ
    } catch (e) {
      // ເນັດຂາດ: ໃຊ້ຜູ້ໃຊ້ທີ່ຈື່ໄວ້ໃນເຄື່ອງໄປກ່ອນ
      if (localStorage.getItem(CURRENT_USER_KEY)) { hideSharedLogin(); return mountApp(); }
    }
  }
  localStorage.removeItem(CURRENT_USER_KEY);
  mountApp();
  if (guest) hideSharedLogin(); else showSharedLogin();
})();

<!-- ===== ສິດ "ເບິ່ງຢ່າງດຽວ" ສຳລັບຜູ້ໃຊ້ທົ່ວໄປ ແລະ Viewer + ແຜນທີ່ບໍ່ບັງເມນູ (ໃຊ້ຮ່ວມ 3 ລະບົບ) ===== -->
<style>
  /* ແຜນທີ່ຢູ່ໃນຊັ້ນຂອງຕົນເອງ → ເລື່ອນໜ້າແລ້ວບໍ່ບັງແຖບເມນູ / ເມນູເລື່ອນລົງ */
  .leaflet-container { isolation: isolate; z-index: 0; }
  div:has(> .leaflet-container) { isolation: isolate; }
  .ro-badge { position: fixed; right: 14px; bottom: 14px; z-index: 9000; background: #334155; color: #f8fafc; font: 600 12px 'Noto Sans Lao', sans-serif; padding: 7px 12px; border-radius: 999px; box-shadow: 0 4px 14px rgba(0,0,0,.25); pointer-events: none; }
  body.map-fs .ro-badge { display: none; }
</style>
<script>
(function () {
  // ປຸ່ມທີ່ຜູ້ໃຊ້ທົ່ວໄປ / Viewer ໃຊ້ບໍ່ໄດ້: ພິມ-ສົ່ງອອກ, ແຈ້ງ/ສົ່ງຂໍ້ຄວາມຫາເຈົ້າຂອງ, ຕັ້ງຄ່າ-ແບກອັບ, ເພີ່ມ/ແກ້ໄຂ/ລົບ/ນຳເຂົ້າ
  var BLOCK = /ສົ່ງອອກ|ພິມ|ປີ້ນ|\bpdf\b|excel|\bcsv\b|\bpng\b|ດາວໂຫລດ|ດາວໂຫຼດ|export|print|download|ສົ່ງຂໍ້ຄວາມ|ຂໍ້ຄວາມດ່ວນ|ສົ່ງແຈ້ງ|ແຈ້ງຫາ|ແຈ້ງເຈົ້າຂອງ|ສົ່ງອີເມວ|ສົ່ງຫາ|message|ຕັ້ງຄ່າ|ແບກອັບ|ສຳຮອງ|ສໍາຮອງ|backup|restore|ຟື້ນຟູ|settings|config|ເພີ່ມ(?!ເຕີມ)|ແກ້ໄຂ|ລຶບ|ລົບ|ບັນທຶກ|ນຳເຂົ້າ|ນໍາເຂົ້າ|import|ຕໍ່ໃບອະນຸຍາດ|ຕໍ່ອາຍຸ|ສະຫຼັບ|ໂປຣໄຟລ໌|ບັນຊີຂອງຂ້ອຍ|ຈັດການຜູ້ໃຊ້|ລ້າງຂໍ້ມູນ|ລວມຊຸດ|ລວມເປັນ|ແປງພິກັດ|📥|🖨|✏️|🗑|➕|⚙/i;
  var ALLOW = /ເຂົ້າສູ່ລະບົບ|log\s*in|ອອກຈາກລະບົບ|ເບິ່ງແບບທົ່ວໄປ|ໜ້າຫຼັກ|ລາຍລະອຽດ|ທັງໝົດ|ຍົກເລີກ|ປິດ|ຕົກລົງ|ສະແດງເພີ່ມ|ເບິ່ງເພີ່ມ|ສະແດງທຸກຖັນ|ເຊື່ອງຖັນ/i;
  function readOnly() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem('waterSession') || sessionStorage.getItem('waterSession') || 'null'); } catch (e) {}
    return !s || !s.key || s.role === 'VIEWER';
  }
  function excluded(el) {
    return el.closest('#loginScreen, #sharedLoginScreen, #navPills, .swal2-container, .leaflet-control-zoom, .leaflet-control-layers, .leaflet-popup');
  }
  var ro = null, badge = null, queued = false;
  function apply() {
    queued = false;
    var on = readOnly();
    if (on !== ro) {
      ro = on;
      document.body.classList.toggle('ro-mode', on);
      if (!on) document.querySelectorAll('[data-ro-hidden]').forEach(function (el) { el.style.display = el.dataset.roPrev || ''; delete el.dataset.roHidden; });
      if (on && !badge) { badge = document.createElement('div'); badge.className = 'ro-badge'; badge.textContent = '👁️ ໂໝດເບິ່ງຢ່າງດຽວ'; document.body.appendChild(badge); }
      if (badge) badge.style.display = on ? '' : 'none';
    }
    if (!on) return;
    var activeHidden = false;
    document.querySelectorAll('button, a[href], [role="button"], label[for], input[type="file"]').forEach(function (el) {
      if (el.dataset.roHidden || excluded(el)) return;
      var a = el.getAttribute('href') || '';
      if (/\.html$|^#?$/.test(a) && el.tagName === 'A' && !el.hasAttribute('download')) return;
      var txt = ((el.innerText || '') + ' ' + (el.title || '') + ' ' + (el.getAttribute('aria-label') || '')).trim();
      if (el.type === 'file' || el.hasAttribute('download') || (BLOCK.test(txt) && !ALLOW.test(el.innerText || ''))) {
        if (/bg-gradient-to-r|border-rose-600|bg-indigo-600/.test(el.className || '') && /ຕັ້ງຄ່າ|ແບກອັບ|ສົ່ງອອກ|backup|settings/i.test(txt)) activeHidden = true;
        el.dataset.roPrev = el.style.display || '';
        el.dataset.roHidden = '1';
        el.style.display = 'none';
      }
    });
    // ຢູ່ໜ້າທີ່ຖືກປິດ (ຕັ້ງຄ່າ / ແບກອັບ / ສົ່ງອອກ) → ກັບໄປໜ້າແຜນທີ່
    if (activeHidden) {
      var nav = [].find.call(document.querySelectorAll('button'), function (b) { return !b.dataset.roHidden && /ແຜນທີ່|GIS/.test(b.innerText || '') && b.offsetParent; });
      if (nav) nav.click();
    }
  }
  function queue() { if (!queued) { queued = true; setTimeout(apply, 200); } }
  new MutationObserver(queue).observe(document.documentElement, { childList: true, subtree: true });
  window.addEventListener('storage', queue);
  setInterval(function () { if (readOnly() !== ro) apply(); }, 1500);
  document.addEventListener('DOMContentLoaded', apply);
  queue();
})();
</script>
