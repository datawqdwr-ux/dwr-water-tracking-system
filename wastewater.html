function getCustomProjectCategories() {
  try {
    const saved = localStorage.getItem("custom_wastewater_project_categories");
    if (saved) {
      const arr = JSON.parse(saved);
      if (Array.isArray(arr)) {
        return arr.filter(c => typeof c === "string" && c.trim() && !PROJECT_CATEGORIES.includes(c.trim()));
      }
    }
  } catch (e) {}
  return [];
}
function saveCustomProjectCategory(newCat) {
  if (!newCat || typeof newCat !== "string") return false;
  const trimmed = newCat.trim();
  if (!trimmed || PROJECT_CATEGORIES.includes(trimmed)) return false;
  try {
    const list = getCustomProjectCategories();
    if (!list.includes(trimmed)) {
      list.push(trimmed);
      localStorage.setItem("custom_wastewater_project_categories", JSON.stringify(list));
      return true;
    }
  } catch (e) {}
  return false;
}
function deleteCustomProjectCategory(cat) {
  if (!cat || typeof cat !== "string") return false;
  try {
    const list = getCustomProjectCategories().filter(c => c !== cat.trim());
    localStorage.setItem("custom_wastewater_project_categories", JSON.stringify(list));
    return true;
  } catch (e) {}
  return false;
}
function getAllProjectCategories(extraFromProjects = []) {
  const custom = getCustomProjectCategories();
  const set = new Set([...PROJECT_CATEGORIES]);
  custom.forEach(c => set.add(c));
  if (Array.isArray(extraFromProjects)) {
    extraFromProjects.forEach(p => {
      const c = p && (typeof p === "string" ? p : p.projectCategory);
      if (c && typeof c === "string" && c.trim()) set.add(c.trim());
    });
  }
  return Array.from(set);

function evaluateWaterQualityAgainstDecree81(waterQuality = {}, targetClass = "ປະເພດ 4", customOverrides = {}) {
  const classOrder = ["ປະເພດ 1", "ປະເພດ 2", "ປະເພດ 3", "ປະເພດ 4", "ປະເພດ 5"];
  const validTargetClass = classOrder.includes(targetClass) ? targetClass : "ປະເພດ 4";
  const { valuesMap, extraCustomParams } = extractProjectDecree81Values(waterQuality, customOverrides);

  let passCount = 0;
  let warnCount = 0;
  let exceedCount = 0;
  let totalEvaluated = 0;

  const allClassSummaries = {};
  classOrder.forEach((cId) => {
    allClassSummaries[cId] = { pass: 0, warn: 0, exceed: 0, total: 0, status: "empty" };
  });

  let worstClassIndex = -1;

  const rows = LAO_STANDARD_81.parameters.map((param, idx) => {
    const rawVal = valuesMap[param.id];
    const hasVal = rawVal !== void 0 && rawVal !== null && rawVal !== "" && !isNaN(parseFloat(rawVal));
    const numVal = hasVal ? parseFloat(rawVal) : null;

    const limitObj = param.classes[validTargetClass];
    const targetEval = evaluateSingleValueAgainstLimit81(numVal, limitObj, param.unit);
    const status = targetEval.status;
    const diffLabel = targetEval.diffLabel;

    if (status === "pass") { passCount++; totalEvaluated++; }
    else if (status === "warn") { warnCount++; totalEvaluated++; }
    else if (status === "exceed") { exceedCount++; totalEvaluated++; }

    const classEvaluations = {};
    classOrder.forEach((cId) => {
      const cLim = param.classes[cId];
      const cEv = evaluateSingleValueAgainstLimit81(numVal, cLim, param.unit);
      classEvaluations[cId] = {
        ...cEv,
        limitLabel: cLim ? cLim.label : "-"
      };
      if (hasVal) {
        allClassSummaries[cId].total++;
        if (cEv.status === "pass") allClassSummaries[cId].pass++;
        else if (cEv.status === "warn") allClassSummaries[cId].warn++;
        else if (cEv.status === "exceed") allClassSummaries[cId].exceed++;
      }
    });

    const bestFitClass = determineParamBestFitClass81(param, numVal);
    if (bestFitClass) {
      const cIdx = classOrder.indexOf(bestFitClass);
      if (bestFitClass === "ເກີນປະເພດ 5") {
        worstClassIndex = Math.max(worstClassIndex, 5);
      } else if (cIdx > worstClassIndex) {
        worstClassIndex = cIdx;
      }
    }

    return {
      index: idx + 1,
      param,
      numVal,
      limitObj,
      status,
      diffLabel,
      classEvaluations,
      bestFitClass
    };
  });

  classOrder.forEach((cId) => {
    const s = allClassSummaries[cId];
    if (s.total > 0) {
      if (s.exceed > 0) s.status = "exceed";
      else if (s.warn > 0) s.status = "warn";
      else s.status = "pass";
    }
  });

  const overallBestFitClass = worstClassIndex === -1
    ? null
    : worstClassIndex >= 5
      ? "ເກີນປະເພດ 5"
      : classOrder[worstClassIndex];

  const overallStatus = totalEvaluated === 0
    ? "empty"
    : exceedCount > 0
      ? "exceed"
      : warnCount > 0
        ? "warn"

  return {
    targetClass: validTargetClass,
    passCount,
    warnCount,
    exceedCount,
    totalEvaluated,
    overallStatus,
    overallBestFitClass,
    allClassSummaries,
    rows,
    valuesMap,
    extraCustomParams
  };
}

  var ALLOW = /ເຂົ້າສູ່ລະບົບ|log\s*in|ອອກຈາກລະບົບ|ເບິ່ງແບບທົ່ວໄປ|ໜ້າຫຼັກ|ລາຍລະອຽດ|ທັງໝົດ|ຍົກເລີກ|ປິດ|ຕົກລົງ|ສະແດງເພີ່ມ|ເບິ່ງເພີ່ມ|ສະແດງທຸກຖັນ|ເຊື່ອງຖັນ/i;
  function readOnly() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem('waterSession') || sessionStorage.getItem('waterSession') || 'null'); } catch (e) {}
    return !s || !s.key || s.role === 'VIEWER';
  }
  function excluded(el) {
    return el.closest('#loginScreen, #sharedLoginScreen, #navPills, .swal2-container, .leaflet-control-zoom, .leaflet-control-layers, .leaflet-popup');
  }
  var ro = null, badge = null, queued = false;
  function apply() {
    queued = false;
    var on = readOnly();
    if (on !== ro) {
      ro = on;
      document.body.classList.toggle('ro-mode', on);
      if (!on) document.querySelectorAll('[data-ro-hidden]').forEach(function (el) { el.style.display = el.dataset.roPrev || ''; delete el.dataset.roHidden; });
      if (on && !badge) { badge = document.createElement('div'); badge.className = 'ro-badge'; badge.textContent = '👁️ ໂໝດເບິ່ງຢ່າງດຽວ'; document.body.appendChild(badge); }
      if (badge) badge.style.display = on ? '' : 'none';
    }
    if (!on) return;
    var activeHidden = false;
    document.querySelectorAll('button, a[href], [role="button"], label[for], input[type="file"]').forEach(function (el) {
      if (el.dataset.roHidden || excluded(el)) return;
      var a = el.getAttribute('href') || '';
      if (/\.html$|^#?$/.test(a) && el.tagName === 'A' && !el.hasAttribute('download')) return;
      var txt = ((el.innerText || '') + ' ' + (el.title || '') + ' ' + (el.getAttribute('aria-label') || '')).trim();
      if (el.type === 'file' || el.hasAttribute('download') || (BLOCK.test(txt) && !ALLOW.test(el.innerText || ''))) {
        if (/bg-gradient-to-r|border-rose-600|bg-indigo-600/.test(el.className || '') && /ຕັ້ງຄ່າ|ແບກອັບ|ສົ່ງອອກ|backup|settings/i.test(txt)) activeHidden = true;
        el.dataset.roPrev = el.style.display || '';
        el.dataset.roHidden = '1';
        el.style.display = 'none';
      }
    });
    // ຢູ່ໜ້າທີ່ຖືກປິດ (ຕັ້ງຄ່າ / ແບກອັບ / ສົ່ງອອກ) → ກັບໄປໜ້າແຜນທີ່
    if (activeHidden) {
      var nav = [].find.call(document.querySelectorAll('button'), function (b) { return !b.dataset.roHidden && /ແຜນທີ່|GIS/.test(b.innerText || '') && b.offsetParent; });
      if (nav) nav.click();
    }
  }
  function queue() { if (!queued) { queued = true; setTimeout(apply, 200); } }
  new MutationObserver(queue).observe(document.documentElement, { childList: true, subtree: true });
  window.addEventListener('storage', queue);
  setInterval(function () { if (readOnly() !== ro) apply(); }, 1500);
  document.addEventListener('DOMContentLoaded', apply);
  queue();
})();
</script>
</body>
